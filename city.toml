[workspace]
provider = "claude"

[agent_defaults]
append_fragments = ["pr-guidance", "kaimon-guidance", "execution-policy"]

[providers]
[providers.claude]
base = "builtin:claude"
ready_delay_ms = 0
[providers.claude.option_defaults]
model = "claude-opus-5-5"
effort = "high"
[providers.codex]
base = "builtin:codex"
ready_delay_ms = 0
args_append = ["--no-alt-screen", "-c", "tui.fullscreen_transcript=false"]
[providers.codex.option_defaults]
model = "gpt-6.1-sol"
effort = "high"

[[service]]
name = "kaimon"
kind = "proxy_process"
state_root = ".gc/services/kaimon-canary"

[service.process]
command = ["commands/kaimon-canary-service"]

[[named_session]]
template = "anatoly"
scope = "city"
mode = "always"

[[named_session]]
template = "kurt"
scope = "city"
mode = "always"

[[named_session]]
template = "peter"
scope = "rig"
dir = "gascity"
mode = "on_demand"

[[named_session]]
template = "bryan"
scope = "city"
mode = "always"

[[named_session]]
template = "bertrand"
scope = "city"
mode = "always"

[[named_session]]
template = "david"
scope = "city"
mode = "always"

[[named_session]]
template = "walter"
scope = "rig"
dir = "reporter"
mode = "on_demand"

[[rigs]]
name = "math-experiments"
prefix = "mx"
default_branch = "main"
# Lab Tech's rig-specific wiring. The labtech pack ships NO defaults for these three
# (they name one rig's filesystem and one rig's lab-book bead), so they live here.
[rigs.formula_vars]
labtech_home = "/Users/Shared/Developer/ai/city/math-experiments/labtech"
labtech_pack = "/Users/Shared/Developer/ai/city/math-city/packs/labtech"
lab_book = "mx-p03"
review_worker_target = "gasvillage.polecat"
[rigs.imports]
[rigs.imports.gasvillage]
source = "packs/gasvillage"
# funsearch — agentic FunSearch pack (epic mc-h4zx)
[rigs.imports.funsearch]
source = "packs/funsearch"
# George is the persistent lab technician; starting him does not resume old runs.
[rigs.imports.labtech]
source = "packs/labtech"

[[rigs]]
name = "gascity"
prefix = "gcs"
default_branch = "main"
# Per-rig CI commands consumed by polecat preflight + self-review (mol-polecat-*).
# gascity is a Go SDK; empty keys (setup/typecheck) skip silently.
[rigs.formula_vars]
lint_command = "go vet ./..."
build_command = "go build ./..."
test_command = "make test"
review_worker_target = "gasvillage.polecat"
[rigs.imports]
[rigs.imports.gasvillage]
source = "packs/gasvillage"
# basic-code-tools — code+proof translation formulas (translate v2). Epic gcs-1gq8.
[rigs.imports.basic-code-tools]
source = "packs/basic-code-tools"

[[rigs]]
name = "math-code-projects"
prefix = "mcp"
default_branch = "main"
[rigs.formula_vars]
review_worker_target = "gasvillage.polecat"
typecheck_command = "/Users/jj-agents/.juliaup/bin/julia --project=. -e 'using Pkg; Pkg.instantiate(); using EdgeIdeals'"
test_command = "/Users/jj-agents/.juliaup/bin/julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.test()'"
lint_command = "PATH=/Users/jj-agents/.juliaup/bin:$PATH /Users/Shared/Developer/ai/city/math-city/packs/julia-tools/lib/no-code-comments.sh"
[rigs.imports]
[rigs.imports.gasvillage]
source = "packs/gasvillage"
# basic-code-tools — code translation formulas (translate v2) for m2->Julia etc. Epic gcs-1gq8.
[rigs.imports.basic-code-tools]
source = "packs/basic-code-tools"

[[rigs]]
name = "latex-projects"
prefix = "lp"
[rigs.formula_vars]
review_worker_target = "gasvillage.polecat"
[rigs.imports]
[rigs.imports.gasvillage]
source = "packs/gasvillage"
[rigs.imports.latex-utils]
source = "packs/latex-utils"

[[rigs]]
name = "beads"
prefix = "beads"
default_branch = "main"
[rigs.formula_vars]
review_worker_target = "gasvillage.polecat"
[rigs.imports]
[rigs.imports.gasvillage]
source = "packs/gasvillage"

[[rigs]]
name = "gascity-packs"
default_branch = "main"

[patches]

# Codex-backed crew defaults. Existing sessions pick these up on next start/reset.
[[patches.agent]]
name = "bertrand"
[patches.agent.option_defaults]
model = "gpt-6.1-sol"

[[patches.agent]]
name = "bryan"
[patches.agent.option_defaults]
model = "gpt-6.1-sol"

[[patches.agent]]
name = "anatoly"

[[patches.agent]]
name = "david"
[patches.agent.option_defaults]
model = "gpt-6.1-sol"

[[patches.agent]]
name = "gasvillage.mayor"
provider = "codex"
[patches.agent.env]
AUTONOMOUS_MODE = "1"
[patches.agent.option_defaults]
model = "gpt-6.1-sol"
effort = "high"

[daemon]
formula_v2 = true

[[rigs]]
name = "lean-projects"
prefix = "lean"
[rigs.formula_vars]
review_worker_target = "gasvillage.polecat"
[rigs.imports]
[rigs.imports.gasvillage]
source = "./packs/gasvillage"
# basic-code-tools — 2nd import target for proof (Lean) translation jobs. Epic gcs-1gq8.
[rigs.imports.basic-code-tools]
source = "./packs/basic-code-tools"

[[rigs]]
name = "reporter"
prefix = "re"
[rigs.formula_vars]
review_worker_target = "gasvillage.polecat"
[rigs.imports]
[rigs.imports.gasvillage]
