description = """
Canonical standard (8-pass) code-review reviewer — the bead-native, single-
provider sibling of the Tier-1 triage reviewer (mol-triage-review). Ports
jjgarzella/code-formulas `standard-code-review` (qdhenry Claude-Command-Suite
/dev/code-review): a universal-breadth audit across six lenses
(quality / security / performance / architecture / testing / docs), preceded by
an analyze pass and followed by a synthesis pass. Breadth is the whole point —
this complements the surgical triage reviewer, it does not replace it.

This is the ONE canonical reviewer fragment (gcs-f4j.8). Two THIN hosts expand it
(zero prompt duplication): a standalone host (mol-standard-review, gcs-f4j.8.4)
slingable like mol-triage-review, and a loop variant (mol-review-loop-standard,
gcs-f4j.8.5) that composes it into mol-review-loop's review-pipeline slot. The
fragment is EXPANDED (compose.expand), not poured: the controller schedules its
beads directly as flat graph children, so at gascity polecat pool=1 nothing
babysits a poured child molecule and there is no self-deadlock.

Shape (built incrementally; THIS file now carries all three stages — the analyze
pass, the six review lenses, and the synthesis pass):
  <target>.analyze    — gcs-f4j.8.1: resolve the diff via the SHARED
                        resolve-diff.sh, write a change summary, run an
                        eligibility gate, and persist diff/files/summary as
                        DURABLE artifacts under the molecule root. Lanes are
                        self-contained beads: they read these durable inputs,
                        never this session's memory.
  <target>.<lens>     — gcs-f4j.8.2: the six review lenses (quality / security /
                        performance / architecture / testing / docs), each a
                        SEPARATELY-DISPATCHED, self-contained lane bead (its own
                        run_target → its own session → its own per-lane opt_model)
                        that reads the durable inputs and files category-labelled
                        candidate wisps. Separate dispatch is what makes per-lane
                        model selection possible; the shared lane transport lives
                        in formulas/lib/review-lane.sh.
  <target>.synthesis  — gcs-f4j.8.3: a single deep-tier pass that needs all six
                        lanes — dedup-merge across them (conservative), assign a
                        severity (blocker / major / minor / nit), promote the
                        survivors to DURABLE finding beads under the molecule
                        root's findings container, and record a synthesis verdict
                        (pass / pass_with_findings / fail / blocked). The shared
                        verdict→severity→promote transport — the same output
                        plumbing triage/quorum use, so apply-fixes stays
                        reviewer-agnostic — lives in formulas/lib/review-synthesis.sh.

(The step IDs use the `{target}` expansion placeholder — substituted with the
host's placeholder step id when the fragment is expanded into a host. Above it is
written <target> to avoid implying it is a variable.)

Dual scope via the `review_target` var (same contract as resolve-diff.sh): a
diff-shaped target (PR | branch | range | base..HEAD) scopes the lenses to the
changed surface; a path / '.' target keeps qdhenry's scope-free whole-repo audit
— but ONLY on the standalone host. The loop variant always feeds a branch diff, so
a path target never reaches the loop.

VAR-NAMING NOTE: the review target var is `review_target`, NOT `target`. In an
expansion template `{target}` is reserved — it is the expansion placeholder for
the host's target step id (substituted before vars), so a var literally named
`target` could never be referenced. The thin hosts keep their own `target` var
and map it onto `review_target` through `[[compose.expand]]` vars. Expansion
templates substitute vars with SINGLE braces (`{review_target}`), unlike the
double-brace `{{var}}` of workflow formulas.
"""
formula = "expansion-standard-reviewer"
version = 2
type = "expansion"

[requires]
formula_compiler = ">=2.0.0"

# --------------------------------------------------------------------------
# Variables — the fragment's full var contract. Referenced with SINGLE braces
# ({name}) because expansion templates substitute via substituteVars (this holds
# in [[template]] metadata values too, not only the description — so the per-lane
# opt_model below resolves at expansion). The analyze pass uses review_target /
# base_branch / aux_model; the six lenses each carry their own model var
# (gcs-f4j.8.2); severity_threshold is consumed by synthesis (gcs-f4j.8.3).
#
# Per-lane model right-sizing: each lens is a SEPARATELY-DISPATCHED step (its own
# session), so each can ride a different model via its step-metadata `opt_model`
# — the reconciler folds opt_model into the spawned session's --model, validated
# against the run_target provider's options_schema (an invalid value is
# skipped+logged, falling back to the agent default). The defaults are tiered:
# deep (opus) for the judgment lenses (security, architecture), standard (sonnet)
# for quality + performance, cheap (haiku) for the mechanical lenses (testing,
# docs). The values opus/sonnet/haiku are the claude provider's model choices;
# the live-spawn fold confirmation is tracked in gcs-f4j.8.2.1.
# --------------------------------------------------------------------------

[vars.review_target]
description = "What to review — a PR (number, #number, or PR URL), a branch name, a commit range, or base_branch..HEAD. Empty (the default) resolves to base_branch..HEAD (the changes on the current branch). A path or '.' is the scope-free whole-repo audit — honored on the standalone host only; the loop variant always feeds a diff. Named review_target, not target: {target} is the reserved expansion placeholder."
default = ""

[vars.base_branch]
description = "Base branch the change is measured against. Used for the default target (base_branch..HEAD) and as the merge-base when the target is a bare branch name."
default = "main"

[vars.aux_model]
description = "Model size for the cheap auxiliary reasoning in the analyze pass — the change summary and the eligibility gate. Default haiku."
default = "haiku"

[vars.quality_model]
description = "Model for the quality lens (code smells / anti-patterns / style / dead code / error handling on the changed surface). Standard tier; default sonnet. Rendered into the quality step's opt_model metadata."
default = "sonnet"

[vars.security_model]
description = "Model for the security lens (vulnerabilities / secrets / authz / input validation on the changed surface). A judgment lens — deep tier; default opus. Rendered into the security step's opt_model metadata."
default = "opus"

[vars.performance_model]
description = "Model for the performance lens (bottlenecks / inefficient algorithms or queries / leaks on the changed surface). Standard tier; default sonnet. Rendered into the performance step's opt_model metadata."
default = "sonnet"

[vars.architecture_model]
description = "Model for the architecture lens (organization / abstraction / coupling / scalability of the change). A judgment lens — deep tier; default opus. Rendered into the architecture step's opt_model metadata."
default = "opus"

[vars.testing_model]
description = "Model for the testing lens (coverage / structure / missing scenarios for the changed surface). A mechanical lens — cheap tier; default haiku. Rendered into the testing step's opt_model metadata."
default = "haiku"

[vars.docs_model]
description = "Model for the docs lens (comments / API docs / README / undocumented invariants touched by the change). A mechanical lens — cheap tier; default haiku. Rendered into the docs step's opt_model metadata."
default = "haiku"

[vars.severity_threshold]
description = "Lowest severity a finding must reach to be surfaced/promoted by synthesis. Ordering blocker > major > minor > nit; the threshold is severity-gated, not confidence-gated (rank, do not suppress whole categories). Default minor surfaces blocker/major/minor and demotes nits. Consumed by synthesis (gcs-f4j.8.3)."
default = "minor"

[vars.synthesis_model]
description = "Model for the synthesis pass (dedup-merge across the six lanes + final severity assignment). A judgment pass — deep tier; default opus. Rendered into the synthesis step's opt_model metadata."
default = "opus"

# --------------------------------------------------------------------------
# Analyze pass — resolve diff + change summary + eligibility gate, persisted
# durably so every downstream lane bead is self-contained.
# --------------------------------------------------------------------------

[[template]]
id = "{target}.analyze"
title = "Analyze: resolve diff + change summary + eligibility gate"
metadata = { "gc.run_target" = "gasvillage.polecat" }
description = '''
You are the ANALYZE pass of the standard (8-pass) code review. You run as ONE
bead-native polecat session. Your job is to turn the review target into DURABLE
inputs the six review lenses can each consume independently:

  1. resolve the review target to a unified diff (or recognize a whole-repo audit),
  2. write a short change summary, and
  3. decide eligibility (skip trivial / generated / empty changes).

Persist all three as DURABLE artifacts hung off the molecule ROOT — NOT in this
session's shell or context. The lenses run as SEPARATE beads in SEPARATE sessions
and read these durable inputs; they never see your session memory. Lanes
communicate via beads and these files, never via shared shell state.

Model tiers across the fragment:
- aux_model           = `{aux_model}`     — this pass's summary + eligibility gate
- the six review lenses each ride their OWN per-lane model (gcs-f4j.8.2), set on
  each lens step's opt_model metadata — deep (opus) for security + architecture,
  standard (sonnet) for quality + performance, cheap (haiku) for testing + docs
- severity_threshold  = `{severity_threshold}` — synthesis surfaces findings at or
  above this severity (gcs-f4j.8.3)

## 1. Resolve the diff + open the durable input store (run verbatim)

This block is pure transport — no judgment. It resolves the target through the
SHARED, vendor-neutral resolver (`resolve-diff.sh`, the single source of truth the
triage reviewer calls too), copies the diff + touched-file list into a durable
store keyed on the molecule root, and records the store handle on the root so
every lane resolves it identically — branch-independent, via `$GC_CITY`. Run it
exactly, then read what it printed:

```bash
set -uo pipefail
json_payload() { awk 'found || /^[[:space:]]*[[{]/{ found=1; print }'; }
echo "[analyze] GC_AGENT=${GC_AGENT:-} GC_BEAD_ID=${GC_BEAD_ID:-} PWD=$PWD"
gc bd heartbeat "$GC_BEAD_ID" || true

# Molecule ROOT — the durable inputs hang off it so every lane finds them.
ROOT=$(bd show "$GC_BEAD_ID" --json 2>/dev/null | json_payload \
  | jq -r 'if type=="array" then .[0] else . end | .metadata["gc.root_bead_id"] // empty')
[ -z "$ROOT" ] && ROOT="$GC_BEAD_ID"   # single-bead molecule: the bead is its own root

# work_dir under review: an inherited work_dir on the root wins (the loop's
# workspace-setup / standalone host records the worktree the reviewer scopes to);
# otherwise this session's worktree. Record it so the lenses resume the same tree.
WORK_DIR=$(bd show "$ROOT" --json 2>/dev/null | json_payload \
  | jq -r 'if type=="array" then .[0] else . end | (.metadata["work_dir"] // .metadata["gc.work_dir"] // empty)')
[ -z "$WORK_DIR" ] && WORK_DIR="$PWD"
bd update "$ROOT" --set-metadata work_dir="$WORK_DIR" >/dev/null 2>&1 || true

# Durable input store, keyed on the molecule root and referenced via $GC_CITY (set
# by the runtime) — exactly like the shared resolver — so it resolves no matter
# which worktree a lane runs in. These files persist on disk: that is what makes
# each lane bead self-contained.
INPUTS_DIR="${GC_CITY:?GC_CITY must be set by the runtime}/.gc/review-inputs/${ROOT}"
mkdir -p "$INPUTS_DIR"

# The SHARED resolver — referenced via $GC_CITY, never a repo-relative path, so it
# resolves even when the branch under review does not carry it.
RESOLVER="${GC_CITY}/formulas/lib/resolve-diff.sh"
[ -x "$RESOLVER" ] || { echo "ERROR: shared resolver missing or not executable at $RESOLVER" >&2; exit 2; }

# Resolve IN the work_dir under review (the checked-out change). stdout carries the
# eval-able TARGET_KIND/DIFF_FILE/FILES_FILE (empty on an empty diff); stderr
# narrates. Exit 2 = path/whole-tree, exit 3 = PR fetch failed. review_target and
# base_branch are baked in at expansion (single-brace expansion vars).
RESOLVED="$(cd "$WORK_DIR" && "$RESOLVER" "{review_target}" "{base_branch}")"; RC=$?

if [ "$RC" -eq 3 ]; then
  echo "ERROR: PR diff fetch failed for the review target; cannot review." >&2
  exit 3
elif [ "$RC" -eq 2 ]; then
  # A path / whole-tree target. On the STANDALONE host this is the deliberate
  # scope-free whole-repo audit (qdhenry's mode); the loop never sends a path, so
  # this branch is only reached standalone. No diff — the lenses scope to the tree.
  TARGET_KIND="path"
  : > "$INPUTS_DIR/files"
  printf 'whole-repo audit: no diff — the six lenses scope to the entire repository checked out at %s\n' \
    "$WORK_DIR" > "$INPUTS_DIR/diff"
  echo "[analyze] whole-repo audit mode (the review target is a path/tree)"
elif [ "$RC" -ne 0 ]; then
  echo "ERROR: resolver exited $RC for the review target." >&2
  exit "$RC"
elif [ -z "$RESOLVED" ]; then
  # exit 0 + empty stdout = empty diff: nothing to review (deterministically
  # ineligible — recorded as such below; no judgment needed).
  TARGET_KIND="empty"
  : > "$INPUTS_DIR/diff"
  : > "$INPUTS_DIR/files"
  echo "[analyze] empty diff — nothing to review."
else
  eval "$RESOLVED"   # sets TARGET_KIND, DIFF_FILE, FILES_FILE
  cp -f "$DIFF_FILE"  "$INPUTS_DIR/diff"
  cp -f "$FILES_FILE" "$INPUTS_DIR/files"
  echo "[analyze] resolved kind=$TARGET_KIND -> durable $INPUTS_DIR/{diff,files}"
fi

# Record the durable handle + resolved kind on the ROOT so lanes resolve them
# bead-natively. (eligibility + summary are recorded in step 3, after the gate.)
bd update "$ROOT" --set-metadata gc.review.inputs_dir="$INPUTS_DIR"
bd update "$ROOT" --set-metadata gc.review.target_kind="$TARGET_KIND"
echo "[analyze] INPUTS_DIR=$INPUTS_DIR  TARGET_KIND=$TARGET_KIND  ROOT=$ROOT  WORK_DIR=$WORK_DIR"
```

After this block you hold (printed above): `INPUTS_DIR` (the durable store),
`TARGET_KIND` (one of `pr` / `branch` / `range` / `path` / `empty`), and `ROOT`.
The unified diff is `$INPUTS_DIR/diff`; the touched-file list is
`$INPUTS_DIR/files`.

## 2. Change summary + eligibility gate (aux_model reasoning)

This is cheap auxiliary reasoning at the `{aux_model}` tier. Decide two things:

**Eligibility** — should this change be reviewed at all? It is determined by
`TARGET_KIND`:
- `empty` → INELIGIBLE. Reason: empty diff, nothing to review. (Deterministic —
  no judgment.)
- `path`  → ELIGIBLE. A whole-repo audit is never "trivial". (Deterministic.)
- `pr` / `branch` / `range` → read `$INPUTS_DIR/diff` and judge. Mark INELIGIBLE
  (skip) if ANY of these hold — mirroring mol-triage-review's eligibility gate:
    * the diff is trivial — whitespace / formatting / comment-only, a version
      bump, or a generated-file-only change;
    * the change is clearly automated (a dependency-bump or codegen commit) and
      obviously fine;
    * this exact change has already been reviewed by this formula (a findings
      container under `$ROOT` already exists).
  Otherwise mark ELIGIBLE. (Anthropic's "PR closed/draft" clauses are dropped: a
  resolved diff has no open/closed state.)

**Change summary** — 2-5 sentences: what the change does and the parts most worth
reviewing (intent, the touched files, the target kind). For an `empty` target the
summary is simply "no changes"; for a `path` target it is "whole-repo audit of
<repo>". The six lenses each start from this shared summary instead of
re-deriving it.

## 3. Persist the summary + eligibility verdict (run verbatim, substituting your values)

Recomputes `ROOT` and `INPUTS_DIR` from scratch (a fresh shell does not inherit
step 1's variables), writes your summary durably, records the eligibility verdict
on the root, and closes this pass. Substitute the three values you determined:
`ELIGIBLE` (`yes` or `no`), `REASON` (one line), and the summary body in the
here-document:

```bash
set -uo pipefail
json_payload() { awk 'found || /^[[:space:]]*[[{]/{ found=1; print }'; }

ELIGIBLE="yes"                       # <-- set to "no" to skip per the gate above
REASON="eligible: non-trivial change under review"   # <-- one-line reason

ROOT=$(bd show "$GC_BEAD_ID" --json 2>/dev/null | json_payload \
  | jq -r 'if type=="array" then .[0] else . end | .metadata["gc.root_bead_id"] // empty')
[ -z "$ROOT" ] && ROOT="$GC_BEAD_ID"
INPUTS_DIR="${GC_CITY:?GC_CITY must be set by the runtime}/.gc/review-inputs/${ROOT}"
mkdir -p "$INPUTS_DIR"

# Durable change summary — the shared starting context for all six lenses.
cat > "$INPUTS_DIR/summary.md" <<'SUMMARY'
<your 2-5 sentence change summary here>
SUMMARY

# Record the eligibility verdict on the ROOT (the lenses + synthesis read it).
bd update "$ROOT" --set-metadata gc.review.eligible="$ELIGIBLE"
bd update "$ROOT" --set-metadata gc.review.eligibility_reason="$REASON"

gc bd heartbeat "$GC_BEAD_ID" || true
bd update "$GC_BEAD_ID" --set-metadata gc.outcome=pass --status=closed \
  --notes "analyze: eligible=$ELIGIBLE ($REASON); durable inputs in $INPUTS_DIR (diff, files, summary.md)"
echo "[analyze] done: eligible=$ELIGIBLE  summary+inputs in $INPUTS_DIR"
```

Exit criteria: `$INPUTS_DIR/{diff,files,summary.md}` exist; the molecule root
carries `gc.review.inputs_dir`, `gc.review.target_kind`, `gc.review.eligible`, and
`gc.review.eligibility_reason`; this analyze bead is closed `gc.outcome=pass`. The
six review lenses (gcs-f4j.8.2) run next, each reading the durable inputs.
'''

# ==========================================================================
# The six review lenses — quality / security / performance / architecture /
# testing / docs. Each is a SEPARATELY-DISPATCHED, self-contained lane bead:
# its own [[template]] → its own gc.run_target → its own session → its own
# per-lane opt_model. They all `needs = ["{target}.analyze"]`, read the analyze
# pass's DURABLE inputs (never another lane's session memory), review ONLY the
# changed surface through their lens, and file each candidate as a
# category-labelled ephemeral wisp under the run's findings container. The
# repeated transport (load inputs → gate → file wisp → close) lives once in the
# shared formulas/lib/review-lane.sh; only the lens reasoning differs per lane.
# A lens that finds nothing self-skips to a clean pass — it is never pruned from
# the graph. Breadth is the point: keep all six, do NOT collapse to bugs-only.
# ==========================================================================

[[template]]
id = "{target}.quality"
title = "Quality lane — code smells / anti-patterns / dead code / error handling on the changed surface"
needs = ["{target}.analyze"]
metadata = { "gc.run_target" = "gasvillage.polecat", "opt_model" = "{quality_model}" }
description = '''
You are the QUALITY review lane of the standard (8-pass) code review — one of six
sibling lanes (quality / security / performance / architecture / testing / docs),
each a SEPARATE bead-native polecat session. You read the DURABLE inputs the
analyze pass recorded and review ONLY the changed surface through the code-quality
lens. You never see the other lanes' sessions; you communicate only through beads.

## 1. Load the durable inputs + eligibility gate (run verbatim)

Pure transport — no judgment. Source the shared lane helper (referenced via
`$GC_CITY`, branch-independent — the same pattern as the shared diff resolver) and
load the inputs the analyze pass hung off the molecule root:

```bash
set -uo pipefail
. "${GC_CITY:?GC_CITY must be set by the runtime}/formulas/lib/review-lane.sh"
review_lane_load_inputs        # sets REVIEW_ROOT/INPUTS_DIR/TARGET_KIND/ELIGIBLE/DIFF/... + heartbeats

if [ "$REVIEW_ELIGIBLE" = "no" ]; then
  # The analyze pass deemed the change ineligible (empty / trivial / generated).
  # This lane is a clean no-op — close pass and file nothing. It is NOT pruned
  # from the graph: every lane runs and self-skips when it has nothing to do.
  review_lane_close "quality: skipped — ineligible ($REVIEW_ELIGIBILITY_REASON)"
  exit 0
fi
echo "[quality] kind=$REVIEW_TARGET_KIND  diff=$REVIEW_DIFF  files=$REVIEW_FILES  summary=$REVIEW_SUMMARY"
```

You now hold the change summary (`$REVIEW_SUMMARY`), the unified diff
(`$REVIEW_DIFF`), and the touched-file list (`$REVIEW_FILES`). For a `path` target
(`$REVIEW_TARGET_KIND` = `path`) there is no diff — audit the whole repository
checked out at the root's `work_dir` (qdhenry's scope-free mode, standalone host
only). Otherwise scope STRICTLY to the changed surface in `$REVIEW_DIFF`.

## 2. Review through the code-quality lens (at the {quality_model} tier)

Read `$REVIEW_SUMMARY` first for intent, then `$REVIEW_DIFF`. Review ONLY the
changed lines (plus the immediately surrounding context needed to judge them) for:

- code smells, anti-patterns, and likely bugs introduced by the change;
- naming and style inconsistencies with the surrounding code;
- unused imports / variables / dead code the change adds;
- error-handling and logging regressions in the new code.

Stay on the changed surface: a pre-existing issue the diff does not touch is out of
scope. If nothing on the changed surface warrants a finding, that is a valid result
— file nothing and close pass (step 3). Do not pad.

For each genuine candidate, hold: a one-line title; the `file:line` in the changed
surface; what is wrong and why it matters; the evidence (a quoted diff line); an
honest self-rated confidence 0-100 (the synthesis pass re-scores and assigns final
severity — do not inflate); and a best-guess priority 0-4.

## 3. File each candidate as a category-labelled wisp + close (run verbatim per candidate)

```bash
set -uo pipefail
. "${GC_CITY:?}/formulas/lib/review-lane.sh"
review_lane_load_inputs

# Repeat per candidate, substituting your values:
BODY=$(mktemp)
cat > "$BODY" <<'EOF'
<file>:<line range> — <what is wrong and why it matters, scoped to the change>

Evidence: <a quoted diff line / the changed construct>
Suggested severity: <blocker|major|minor|nit>   # a hint; synthesis decides
EOF
review_lane_file_finding quality <confidence 0-100> <priority 0-4> "<one-line title>" "$BODY"

# After all candidates — or immediately, if this lens found nothing (clean pass):
review_lane_close "quality: filed <N> candidate finding(s) (category:quality)"
```

Exit criteria: every code-quality candidate on the changed surface is filed as a
`category:quality` wisp under `${REVIEW_ROOT}.findings` with a `Confidence: X/100`
first line; this lane bead is closed `gc.outcome=pass`. Zero findings is a clean pass.
'''

[[template]]
id = "{target}.security"
title = "Security lane — vulnerabilities / secrets / authz / input validation on the changed surface"
needs = ["{target}.analyze"]
metadata = { "gc.run_target" = "gasvillage.polecat", "opt_model" = "{security_model}" }
description = '''
You are the SECURITY review lane of the standard (8-pass) code review — one of six
sibling lanes (quality / security / performance / architecture / testing / docs),
each a SEPARATE bead-native polecat session. You read the DURABLE inputs the
analyze pass recorded and review ONLY the changed surface through the security
lens. You never see the other lanes' sessions; you communicate only through beads.

## 1. Load the durable inputs + eligibility gate (run verbatim)

Pure transport — no judgment. Source the shared lane helper (referenced via
`$GC_CITY`, branch-independent — the same pattern as the shared diff resolver) and
load the inputs the analyze pass hung off the molecule root:

```bash
set -uo pipefail
. "${GC_CITY:?GC_CITY must be set by the runtime}/formulas/lib/review-lane.sh"
review_lane_load_inputs        # sets REVIEW_ROOT/INPUTS_DIR/TARGET_KIND/ELIGIBLE/DIFF/... + heartbeats

if [ "$REVIEW_ELIGIBLE" = "no" ]; then
  # The analyze pass deemed the change ineligible (empty / trivial / generated).
  # This lane is a clean no-op — close pass and file nothing. It is NOT pruned
  # from the graph: every lane runs and self-skips when it has nothing to do.
  review_lane_close "security: skipped — ineligible ($REVIEW_ELIGIBILITY_REASON)"
  exit 0
fi
echo "[security] kind=$REVIEW_TARGET_KIND  diff=$REVIEW_DIFF  files=$REVIEW_FILES  summary=$REVIEW_SUMMARY"
```

You now hold the change summary (`$REVIEW_SUMMARY`), the unified diff
(`$REVIEW_DIFF`), and the touched-file list (`$REVIEW_FILES`). For a `path` target
(`$REVIEW_TARGET_KIND` = `path`) there is no diff — audit the whole repository
checked out at the root's `work_dir` (qdhenry's scope-free mode, standalone host
only). Otherwise scope STRICTLY to the changed surface in `$REVIEW_DIFF`.

## 2. Review through the security lens (at the {security_model} tier)

Read `$REVIEW_SUMMARY` first for intent, then `$REVIEW_DIFF`. Review ONLY the
changed lines (plus the surrounding context needed to judge reachability) for:

- common vulnerabilities the change introduces or makes reachable — injection
  (SQL / command / template), XSS, SSRF, path traversal, unsafe deserialization,
  SSTI, and the like;
- hardcoded secrets, API keys, tokens, or passwords added or exposed by the change;
- authentication / authorization logic the change introduces, weakens, or bypasses;
- input validation and sanitization at the trust boundaries the change touches.

Stay on the changed surface: a pre-existing weakness the diff does not touch is out
of scope. Reason about reachability — a flagged sink only matters if the change can
actually reach it. If nothing on the changed surface warrants a finding, that is a
valid result — file nothing and close pass (step 3). Do not pad.

For each genuine candidate, hold: a one-line title; the `file:line` in the changed
surface; the vulnerability class and how it is reached; the evidence (a quoted diff
line); an honest self-rated confidence 0-100 (the synthesis pass re-scores and
assigns final severity — do not inflate); and a best-guess priority 0-4.

## 3. File each candidate as a category-labelled wisp + close (run verbatim per candidate)

```bash
set -uo pipefail
. "${GC_CITY:?}/formulas/lib/review-lane.sh"
review_lane_load_inputs

# Repeat per candidate, substituting your values:
BODY=$(mktemp)
cat > "$BODY" <<'EOF'
<file>:<line range> — <the vulnerability and how the change reaches it>

Evidence: <a quoted diff line / the changed construct>
Suggested severity: <blocker|major|minor|nit>   # a hint; synthesis decides
EOF
review_lane_file_finding security <confidence 0-100> <priority 0-4> "<one-line title>" "$BODY"

# After all candidates — or immediately, if this lens found nothing (clean pass):
review_lane_close "security: filed <N> candidate finding(s) (category:security)"
```

Exit criteria: every security candidate on the changed surface is filed as a
`category:security` wisp under `${REVIEW_ROOT}.findings` with a `Confidence: X/100`
first line; this lane bead is closed `gc.outcome=pass`. Zero findings is a clean pass.
'''

[[template]]
id = "{target}.performance"
title = "Performance lane — bottlenecks / inefficient algorithms or queries / leaks on the changed surface"
needs = ["{target}.analyze"]
metadata = { "gc.run_target" = "gasvillage.polecat", "opt_model" = "{performance_model}" }
description = '''
You are the PERFORMANCE review lane of the standard (8-pass) code review — one of
six sibling lanes (quality / security / performance / architecture / testing /
docs), each a SEPARATE bead-native polecat session. You read the DURABLE inputs the
analyze pass recorded and review ONLY the changed surface through the performance
lens. You never see the other lanes' sessions; you communicate only through beads.

## 1. Load the durable inputs + eligibility gate (run verbatim)

Pure transport — no judgment. Source the shared lane helper (referenced via
`$GC_CITY`, branch-independent — the same pattern as the shared diff resolver) and
load the inputs the analyze pass hung off the molecule root:

```bash
set -uo pipefail
. "${GC_CITY:?GC_CITY must be set by the runtime}/formulas/lib/review-lane.sh"
review_lane_load_inputs        # sets REVIEW_ROOT/INPUTS_DIR/TARGET_KIND/ELIGIBLE/DIFF/... + heartbeats

if [ "$REVIEW_ELIGIBLE" = "no" ]; then
  # The analyze pass deemed the change ineligible (empty / trivial / generated).
  # This lane is a clean no-op — close pass and file nothing. It is NOT pruned
  # from the graph: every lane runs and self-skips when it has nothing to do.
  review_lane_close "performance: skipped — ineligible ($REVIEW_ELIGIBILITY_REASON)"
  exit 0
fi
echo "[performance] kind=$REVIEW_TARGET_KIND  diff=$REVIEW_DIFF  files=$REVIEW_FILES  summary=$REVIEW_SUMMARY"
```

You now hold the change summary (`$REVIEW_SUMMARY`), the unified diff
(`$REVIEW_DIFF`), and the touched-file list (`$REVIEW_FILES`). For a `path` target
(`$REVIEW_TARGET_KIND` = `path`) there is no diff — audit the whole repository
checked out at the root's `work_dir` (qdhenry's scope-free mode, standalone host
only). Otherwise scope STRICTLY to the changed surface in `$REVIEW_DIFF`.

## 2. Review through the performance lens (at the {performance_model} tier)

Read `$REVIEW_SUMMARY` first for intent, then `$REVIEW_DIFF`. Review ONLY the
changed lines (plus the surrounding context needed to judge hot paths) for:

- performance bottlenecks the change introduces;
- inefficient algorithms or data-access patterns added — N+1 queries, missing
  indexes, accidental quadratic loops, repeated work inside loops, unbounded reads;
- memory-usage patterns and potential leaks in the new code (unbounded growth,
  retained references, missing close/free);
- where the stack warrants it, bundle-size / allocation / optimization regressions.

Stay on the changed surface: a pre-existing hot spot the diff does not touch is out
of scope. Prefer findings with a plausible real-world impact over micro-optimisation
nits. If nothing on the changed surface warrants a finding, that is a valid result
— file nothing and close pass (step 3). Do not pad.

For each genuine candidate, hold: a one-line title; the `file:line` in the changed
surface; the inefficiency and its expected impact; the evidence (a quoted diff
line); an honest self-rated confidence 0-100 (the synthesis pass re-scores and
assigns final severity — do not inflate); and a best-guess priority 0-4.

## 3. File each candidate as a category-labelled wisp + close (run verbatim per candidate)

```bash
set -uo pipefail
. "${GC_CITY:?}/formulas/lib/review-lane.sh"
review_lane_load_inputs

# Repeat per candidate, substituting your values:
BODY=$(mktemp)
cat > "$BODY" <<'EOF'
<file>:<line range> — <the inefficiency and its expected impact>

Evidence: <a quoted diff line / the changed construct>
Suggested severity: <blocker|major|minor|nit>   # a hint; synthesis decides
EOF
review_lane_file_finding performance <confidence 0-100> <priority 0-4> "<one-line title>" "$BODY"

# After all candidates — or immediately, if this lens found nothing (clean pass):
review_lane_close "performance: filed <N> candidate finding(s) (category:performance)"
```

Exit criteria: every performance candidate on the changed surface is filed as a
`category:performance` wisp under `${REVIEW_ROOT}.findings` with a `Confidence: X/100`
first line; this lane bead is closed `gc.outcome=pass`. Zero findings is a clean pass.
'''

