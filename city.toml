[workspace]
provider = "claude"

[providers]
[providers.claude]
base = "builtin:claude"
ready_delay_ms = 0
[providers.claude.option_defaults]
effort = "xhigh"
[providers.codex]
base = "builtin:codex"
ready_delay_ms = 0

[[named_session]]
template = "jacob"
scope = "rig"
dir = "phd-thesis"
mode = "on_demand"

[[named_session]]
template = "dustin"
scope = "rig"
dir = "gascity"
mode = "on_demand"

[[named_session]]
template = "peter"
scope = "rig"
dir = "gascity"
mode = "on_demand"

[[named_session]]
template = "bhargav"
scope = "rig"
dir = "math-experiments"
mode = "on_demand"

[[rigs]]
name = "math-experiments"
prefix = "mx"
default_branch = "main"
[rigs.imports]
[rigs.imports.gasvillage]
source = "packs/gasvillage"
[rigs.imports.labtech]
source = "packs/labtech"

[[rigs]]
name = "gascity"
prefix = "gcs"
default_branch = "main"
[rigs.imports]
[rigs.imports.gasvillage]
source = "packs/gasvillage"

[[rigs]]
name = "GPUFiniteFieldMatrices.jl"
default_branch = "main"
[rigs.imports]
[rigs.imports.gasvillage]
source = "packs/gasvillage"

[[rigs]]
name = "DeRham.jl"
default_branch = "main"
[rigs.imports]
[rigs.imports.gasvillage]
source = "packs/gasvillage"

[[rigs]]
name = "phd-thesis"
default_branch = "main"
[rigs.imports]
[rigs.imports.gasvillage]
source = "packs/gasvillage"
[rigs.imports.latex-utils]
source = "packs/latex-utils"

[[rigs]]
name = "beads"
prefix = "beads"
default_branch = "main"
[rigs.imports]
[rigs.imports.gasvillage]
source = "packs/gasvillage"

[[rigs]]
name = "gascity-packs"
default_branch = "main"

[[rigs]]
name = "NewtonExperiments"
prefix = "ne"
default_branch = "main"
[rigs.imports]
[rigs.imports.gasvillage]
source = "./packs/gasvillage"

[daemon]
formula_v2 = true

# TEMPORARY (mx-4kt): suspend the labtech autonomous tick to stop the over-firing
# cron from tearing down detached runs (3 consecutive losses 02:08-03:08 UTC
# 2026-06-07: mx-p03.7/.8/.9). The pack-defined agent can only be suspended via a
# patch. REMOVE this block (and `gc reload`) once the run-durability fix lands so
# detached runs survive the next tick's process-tree teardown. — bhargav 2026-06-07
[[patches.agent]]
dir = "math-experiments"
name = "labtech.tick"
suspended = true
