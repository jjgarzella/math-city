description = """
Standard (8-pass) review->fix loop — the codex-free production loop variant
(gascity gcs-f4j.8.5). It is the de-smoked, real-reviewer sibling of
mol-review-loop-smoke and the loop counterpart of the standalone host
mol-standard-review: the SAME canonical reviewer fragment
(expansion-standard-reviewer, gcs-f4j.8) `[[compose.expand]]`d into
mol-review-loop's review-pipeline slot, with a REAL apply-fixes that consumes the
reviewer's synthesis output. Zero prompt duplication — every reviewer prompt lives
in the one fragment; this file is the loop skeleton + the verdict mapping.

This is the reviewer that finally fills mol-review-loop's no-op review-pipeline
placeholder (gcs-u45i): a slung base mol-review-loop reviews NOTHING and trivially
converges; THIS variant runs the analyze -> six lenses -> synthesis reviewer
in-loop and feeds its durable findings to apply-fixes. Single-provider only —
codex is unavailable, so the quorum variant (gcs-f4j.5) stays parked; it will reuse
this exact machinery, swapping only the reviewer fragment.

Shape (mirrors mol-review-loop / mol-review-loop-smoke):
  workspace-setup -> review-loop (ralph [steps.check])
  review-loop body children = [review-pipeline (compose.expand'd) -> test -> apply-fixes]

Each ralph attempt:
  1. review-pipeline runs the standard reviewer — analyze (resolve the diff via
     the shared resolve-diff.sh) -> six lenses (quality / security / performance /
     architecture / testing / docs) -> synthesis. Synthesis dedup-merges, assigns
     severity, promotes the survivors to DURABLE findings under <root>.findings,
     and records gc.review.synthesis_verdict (pass / pass_with_findings / fail /
     blocked) + counts on the molecule root.
  2. test runs the configured test_command through the same shared
     review-apply-fixes.sh gate used before commits. Strict mode requires exit 0;
     the temporary no-new-failures mode requires the fix-head failure set to be a
     subset of the immutable review base. The result is recorded for this attempt.
  3. apply-fixes (pool-dispatched, gc.run_target={{review_worker_target}} — a fresh
     polecat context per attempt) resumes the branch under review, reads the
     synthesis verdict, test result, and durable findings, applies fixes under the
     severity-threshold policy, then sets the loop's done/iterate verdict. The
     verdict->severity->fix mapping is the SHARED,
     reviewer-agnostic formulas/lib/review-apply-fixes.sh (the codex-independent
     half of gcs-f4j.5); the per-finding fix-vs-surface call is the agent's
     judgment (ZFC), not Go logic.
  4. The controller runs the SHARED verdict-glue check (formulas/lib/review-verdict.sh,
     installed into work_dir at setup — the exact same check the base loop uses):
     only synthesis pass plus test-gate pass converges. Otherwise iterate within
     the bounded attempt budget or request agent recovery/replanning without completing the current phase.

Why EXPAND, not pour: the controller schedules the fragment's beads directly as
flat graph children inside the ralph iteration body, so at gascity polecat pool=1
nothing has to babysit a poured child molecule whose lanes also need that one slot
-> no self-deadlock.

Severity threshold (severity_threshold, default minor): the fix policy is
fix blocker/major/minor, surface nit. It flows into the fragment's synthesis pass
(which promotes durable findings at or above the threshold and burns the rest —
the burned tally is the "surfaced but sub-threshold" count apply-fixes reports) AND
into apply-fixes as the fix threshold the agent applies per finding. Ranking, never
category suppression.

Convergence and retry policy (formulas/lib/review-apply-fixes.sh):
  synthesis pass + tests pass on the final head -> done
  actionable findings or a genuine test failure -> fix, test, re-review
  missing/stale results, blocked synthesis, tool/store errors -> recover
  scope refusal, non-progress, failed final verification -> replan
  missing external authority/access/product decision -> explicit human request

Recover and replan are autonomous agent actions, not successful reviews. The
current phase stays owned and open, so the installed controller cannot advance
it while recovery or coordinator handoff is pending. Three regular attempts may
make fixes; the fourth is verification only. Failure at that cap requests agent
replanning, not human intervention or another identical verification attempt.
The total cap is 4 (literal max_attempts — the compiler parses it as an int
before variable substitution): three regular attempts plus at most one verification.

Optional fire-and-forget notify: pass --var notify_target=<session id-or-alias> and
the verdict check sends a best-effort `gc session nudge` on convergence or cap.
Recovery/replanning helpers notify the coordinator directly while the current
phase stays owned and open. Empty (the default) = no notify.

Sling (review the changes on the current branch, default target base_branch..HEAD):
  gc sling gascity/gasvillage.polecat <bead> --on mol-review-loop-standard --var push_remote=<remote> --nudge
Tune the reviewer (any fragment var flows through, e.g. a deeper synthesis tier):
  gc sling gascity/gasvillage.polecat <bead> --on mol-review-loop-standard \\
    --var push_remote=<remote> --var severity_threshold=major --var synthesis_model=opus --nudge
"""
formula = "mol-review-loop-standard"

[requires]
formula_compiler = ">=2.0.0"

# --------------------------------------------------------------------------
# Variables — the loop re-declares the fragment's full var contract (so the
# whole reviewer is tunable from one --var surface, mapping the loop's `target`
# onto the fragment's `review_target`) plus the loop's own knobs (notify_target;
# severity_threshold doubles as the apply-fixes fix threshold). Each fragment var
# is propagated by the [[compose.expand]] vars block below (single-brace {name},
# resolved against these vars at compile time). Defaults mirror the fragment's so
# an un-tuned sling behaves exactly like the documented model tiering.
# --------------------------------------------------------------------------

[vars.target]
description = """
What to review — a PR (number, #number, or PR URL), a branch name, a commit
range, or empty for base_branch..HEAD (the changes on the current branch). Mapped
onto the fragment's review_target. A path / whole-repo audit is NOT honored in the
loop (the loop always feeds a branch diff to fix); use the standalone host
mol-standard-review for a scope-free audit.
"""
default = ""

[vars.base_branch]
description = "Base branch the change is measured against (the default target base_branch..HEAD, and the merge-base for a bare branch name)."
default = "main"

[vars.work_dir]
description = "Explicit worktree under review. Takes precedence over root metadata; when neither supplies a valid directory, workspace-setup stops."
default = ""

[vars.branch]
description = "Explicit feature branch under review. Takes precedence over root metadata."
default = ""

[vars.push_remote]
description = "Git remote to receive review fix commits. The caller must choose the destination explicitly."
required = true

[vars.base_sha]
description = "Immutable review base commit captured by the implementation trigger. When provided, target should be base_sha..HEAD."
default = ""

[vars.test_command]
description = "Rig test command. The rig's formula_vars value is used by default; an explicit review-loop var overrides it. Empty skips the commit gate."
default = ""

[vars.test_gate]
description = "Temporary test-gate policy: no-new-failures compares a failing fix-head run with the immutable review base; strict rejects every non-zero run and is the permanent target."
default = "no-new-failures"

[vars.test_failure_pattern]
description = "Optional per-rig Bash ERE used to extract failure identifiers; it must contain exactly one capture group. Empty uses normalized output lines containing FAIL or ERROR."
default = ""

[vars.allowed_paths]
description = "Optional newline-separated repo-relative allowed paths (directory prefixes end in /). Empty allows the reviewed diff and its related tests."
default = ""

[vars.severity_threshold]
description = """
The fix policy threshold (ordering blocker > major > minor > nit). Default minor:
fix blocker/major/minor, surface nit. It flows BOTH into the fragment's synthesis
pass (which promotes durable findings at or above it and burns the rest — the
burned count is the surfaced-but-sub-threshold tally apply-fixes reports) AND into
apply-fixes as the threshold the agent applies per finding. Severity-gated ranking,
never whole-category suppression.
"""
default = "minor"

[vars.aux_model]
description = "Model for the analyze pass's cheap auxiliary reasoning (change summary + eligibility gate). Default haiku."
default = "haiku"

[vars.quality_model]
description = "Model for the quality lens (code smells / anti-patterns / dead code / error handling). Standard tier; default sonnet."
default = "sonnet"

[vars.security_model]
description = "Model for the security lens (vulnerabilities / secrets / authz / input validation). A judgment lens — deep tier; default opus."
default = "opus"

[vars.performance_model]
description = "Model for the performance lens (bottlenecks / inefficient algorithms or queries / leaks). Standard tier; default sonnet."
default = "sonnet"

[vars.architecture_model]
description = "Model for the architecture lens (organization / abstraction / coupling / scalability). A judgment lens — deep tier; default opus."
default = "opus"

[vars.testing_model]
description = "Model for the testing lens (coverage / structure / missing scenarios). A mechanical lens — cheap tier; default haiku."
default = "haiku"

[vars.docs_model]
description = "Model for the docs lens (comments / API docs / README / undocumented invariants). A mechanical lens — cheap tier; default haiku."
default = "haiku"

[vars.synthesis_model]
description = "Model for the synthesis pass (dedup-merge across the six lanes + final severity assignment). A judgment pass — deep tier; default opus."
default = "opus"

[vars.notify_target]
description = """
Optional fire-and-forget notify recipient — a running session id or alias. When
non-empty it is recorded on the molecule root as gc.review_loop.notify; the
verdict-glue check sends a best-effort `gc session nudge` for converged or capped
transitions; recovery/replanning helpers notify the coordinator directly while
the current phase stays owned and open. Empty (the default) disables notify.
"""
default = ""

[vars.review_worker_target]
description = "Pool target for reviewer/apply-fixes steps. Defaults to the city-scope claude pool; rigs override this via formula_vars to gasvillage.polecat."
default = "claude"

[[steps]]
id = "workspace-setup"
title = "Install the verdict-glue check into work_dir + record loop metadata"
description = '''
Prepare the loop: install the shared verdict-glue check into the work_dir under
review so the ralph check's relative path resolves there, and record the loop
metadata the controller-run check needs. This is pure transport — run exactly
this block, then stop:

```bash
set -uo pipefail
json_payload() { awk 'found || /^[[:space:]]*[[{]/{ found=1; print }'; }
. "${GC_CITY:?GC_CITY must be set by the runtime}/formulas/lib/resolve-phase-bead.sh"
review_phase_resolve workspace-setup || exit $?
echo "[workspace-setup] GC_AGENT=${GC_AGENT:-} GC_BEAD_ID=${GC_BEAD_ID:-} PWD=$PWD"

# Resolve the molecule ROOT so the ralph control bead inherits work_dir.
ROOT="$REVIEW_PHASE_ROOT_ID"
gc bd heartbeat "$GC_BEAD_ID" || true

# Explicit context from the implementation trigger is authoritative. Direct
# slings may omit it, so fall back to durable root metadata, but never use this
# worker's PWD: it can point at the wrong repository/branch.
ROOT_JSON=$(bd show "$ROOT" --json 2>/dev/null | json_payload)
WORK_DIR="{{work_dir}}"
[ -z "$WORK_DIR" ] && WORK_DIR=$(printf '%s\n' "$ROOT_JSON" | jq -r \
  'if type=="array" then .[0] else . end | (.metadata["work_dir"] // empty)')
if [ -z "$WORK_DIR" ] || [ ! -d "$WORK_DIR" ]; then
  echo "STOP: no valid work_dir supplied or recorded on root $ROOT; refusing to fall back to PWD" >&2
  exit 1
fi
WORK_DIR=$(cd "$WORK_DIR" && pwd -P) || {
  echo "STOP: cannot enter work_dir $WORK_DIR" >&2
  exit 1
}
BRANCH="{{branch}}"
[ -z "$BRANCH" ] && BRANCH=$(printf '%s\n' "$ROOT_JSON" | jq -r \
  'if type=="array" then .[0] else . end | .metadata["branch"] // empty')
BASE_SHA="{{base_sha}}"
[ -z "$BASE_SHA" ] && BASE_SHA=$(printf '%s\n' "$ROOT_JSON" | jq -r \
  'if type=="array" then .[0] else . end | .metadata["base_sha"] // empty')

# Install the shared, reviewer-agnostic verdict-glue check INTO work_dir. The
# single source of truth is the city's lib, referenced via $GC_CITY (set by the
# runtime) so it resolves no matter which branch is checked out here. The check
# is referenced by a RELATIVE path from the formula, so it must live under
# work_dir (gastownhall/gascity#2320).
VERDICT_SRC="${GC_CITY:?GC_CITY must be set by the runtime}/formulas/lib/review-verdict.sh"
[ -x "$VERDICT_SRC" ] || { echo "ERROR: shared verdict check missing or not executable at $VERDICT_SRC" >&2; exit 1; }
cp -f "$VERDICT_SRC" "$WORK_DIR/.gc-review-verdict.sh"
chmod +x "$WORK_DIR/.gc-review-verdict.sh"

# Record work_dir on the ROOT (the ralph control bead inherits it for the check)
# and on this bead. Carry the optional notify target onto the root so the
# controller-run check can fire its fire-and-forget nudge.
bd update "$ROOT" --set-metadata work_dir="$WORK_DIR"
if [ -n "$BRANCH" ]; then
  bd update "$ROOT" --set-metadata branch="$BRANCH"
fi
if [ -n "$BASE_SHA" ]; then
  bd update "$ROOT" --set-metadata base_sha="$BASE_SHA"
fi
bd update "$GC_BEAD_ID" --set-metadata work_dir="$WORK_DIR" || true
NOTIFY="{{notify_target}}"
[ -n "$NOTIFY" ] && bd update "$ROOT" --set-metadata gc.review_loop.notify="$NOTIFY"

echo "[workspace-setup] WORK_DIR=$WORK_DIR ROOT=$ROOT notify=${NOTIFY:-<none>}"
ls -l "$WORK_DIR/.gc-review-verdict.sh"

bd update "$GC_BEAD_ID" --set-metadata gc.outcome=pass --status=closed \
  --notes "workspace-setup: installed .gc-review-verdict.sh into $WORK_DIR, recorded work_dir on root $ROOT"
```

Exit criteria: .gc-review-verdict.sh present and executable in work_dir, work_dir
recorded on the root bead, this step closed pass.
'''

[[steps]]
id = "review-loop"
title = "Review loop: ralph [steps.check] over [review-pipeline (standard reviewer) -> apply-fixes]"
needs = ["workspace-setup"]
description = '''
Standard-reviewer ralph review->fix loop. There is no agent action on this control
step itself — after each iteration body closes, the controller runs the relative
exec check (.gc-review-verdict.sh, installed at workspace-setup) and either stops
(verdict converged) or spawns the next attempt, up to the cap. The iteration body
(children below) is [review-pipeline -> test -> apply-fixes]; review-pipeline is
expanded via compose.expand into the expansion-standard-reviewer fragment, test
runs the shared configured test gate, and apply-fixes requires both a synthesis
pass and a passing test result to converge.
'''

[steps.check]
# Three regular attempts plus exactly one final verification. The apply-fixes
# step permits attempt four only as a read-only verification and replans any
# new findings/test failures, so this total cap cannot become an unbounded retry.
max_attempts = 4

[steps.check.check]
mode = "exec"
path = ".gc-review-verdict.sh"
timeout = "120s"

[[steps.children]]
id = "review-pipeline"
title = "Standard (8-pass) reviewer (placeholder; expanded via compose.expand)"
metadata = { "gc.run_target" = "{{review_worker_target}}" }
description = '''
PLACEHOLDER reviewer slot — never runs as written. It is replaced at compile time
by `[[compose.expand]]` with the canonical expansion-standard-reviewer fragment
(analyze -> six lenses -> synthesis). If you are reading this in a live bead, the
expansion did not apply; that is a wiring bug in this loop variant. The expanded
synthesis pass records gc.review.synthesis_verdict + durable findings on the
molecule root, which apply-fixes (next) consumes.
'''

[[steps.children]]
id = "test"
title = "Run the configured test gate for this attempt"
needs = ["review-pipeline"]
metadata = { "gc.run_target" = "{{review_worker_target}}" }
description = '''
Run the deterministic test gate after review and before apply-fixes on every
attempt. This uses the same test_command, test_gate, failure pattern, immutable
base comparison, and failure-finding code as the guarded commit path in
formulas/lib/review-apply-fixes.sh. A test failure records a durable testing
finding and result=fail, then closes this step normally so apply-fixes can address
it; this step never writes review.verdict. A passing result means strict mode
passed, or (under the temporary no-new-failures mode) fix-head failures are a
subset of the immutable review base's failures.

Run exactly:

```bash
set -uo pipefail
. "${GC_CITY:?GC_CITY must be set by the runtime}/formulas/lib/review-apply-fixes.sh"
TEST_COMMAND=$(cat <<'GC_TEST_COMMAND_VALUE'
{{test_command}}
GC_TEST_COMMAND_VALUE
)
TEST_GATE=$(cat <<'GC_TEST_GATE_VALUE'
{{test_gate}}
GC_TEST_GATE_VALUE
)
TEST_FAILURE_PATTERN=$(cat <<'GC_TEST_FAILURE_PATTERN_VALUE'
{{test_failure_pattern}}
GC_TEST_FAILURE_PATTERN_VALUE
)
export TEST_COMMAND TEST_GATE TEST_FAILURE_PATTERN
review_apply_fixes_load test || exit $?

[ -n "$REVIEW_WORK_DIR" ] && cd "$REVIEW_WORK_DIR"
START_HEAD=$(git rev-parse HEAD) || exit 2
bd update "$REVIEW_ROOT" \
  --set-metadata gc.review.iteration_start_head="$START_HEAD" \
  --set-metadata gc.review.test_result=running \
  --set-metadata gc.review.test_attempt="$REVIEW_ATTEMPT" || exit 2

test_status=0
review_apply_fixes_test_before_commit "$REVIEW_TEST_COMMAND" || test_status=$?
case "$test_status" in
  0) result=pass ;;
  10) result=fail ;; # durable testing finding recorded; continue to apply-fixes
  *) exit "$test_status" ;;
esac
bd update "$GC_BEAD_ID" --set-metadata gc.outcome=pass --status=closed \
  --notes "test: attempt=$REVIEW_ATTEMPT result=$result under $REVIEW_TEST_GATE policy"
```

Exit criteria: the configured test gate ran (or was explicitly skipped because
test_command is empty), its result is recorded on the root for this attempt, and
this step is closed pass.
'''

[[steps.children]]
id = "apply-fixes"
title = "Apply fixes + require synthesis and test pass to converge"
needs = ["test"]
metadata = { "gc.run_target" = "{{review_worker_target}}" }
description = '''
Pool-dispatched to a FRESH polecat each iteration (gc.run_target={{review_worker_target}}),
so every attempt starts with clean context. You resume the branch under review,
consume the standard reviewer's synthesis output (the verdict + the durable
findings it just promoted) and this attempt's deterministic test result, apply the
fixes per the severity-threshold policy, and write the review.verdict the loop's
check reads. Convergence requires synthesis=pass AND test_result=pass.

The verdict->severity->fix TRANSPORT is the shared, reviewer-agnostic
formulas/lib/review-apply-fixes.sh (the codex-independent half of gcs-f4j.5,
reused unchanged by the quorum variant). It reads the synthesis output,
enumerates durable findings, maps the verdict vocabulary, and safely gates the
fix commit: only the reviewed paths and their tests may change, the configured
test command is checked again before commit, and a successful commit is pushed. The
temporary `test_gate=no-new-failures` policy permits a failing fix-head run only
when its extracted failure identifiers are a subset of failures from one run at
the immutable review base in a disposable worktree. This default is temporary;
`test_gate=strict` (any non-zero test result blocks commit) is the permanent
target. A rig may set `test_failure_pattern` to a Bash ERE with exactly one
capture group for a stable failure identifier; otherwise normalized output
lines containing FAIL or ERROR are compared. An unavailable base run or
unreadable failure set fails closed. The pre-existing set is recorded on the
root and in the apply-fixes note. WHICH
findings you fix vs surface, whether a blocker is fixable, and whether you
actually changed the branch are YOUR judgment (ZFC).

## 1. Load the run, validate this attempt's test result, and branch on the verdict

Load the run and decide the terminal cases in ONE block, so the synthesis and
test outputs are in scope where you branch on them:

```bash
set -uo pipefail
. "${GC_CITY:?GC_CITY must be set by the runtime}/formulas/lib/review-apply-fixes.sh"
export FIX_THRESHOLD="{{severity_threshold}}"   # fix policy: fix at/above, surface below
TEST_COMMAND=$(cat <<'GC_TEST_COMMAND_VALUE'
{{test_command}}
GC_TEST_COMMAND_VALUE
)
TEST_GATE=$(cat <<'GC_TEST_GATE_VALUE'
{{test_gate}}
GC_TEST_GATE_VALUE
)
TEST_FAILURE_PATTERN=$(cat <<'GC_TEST_FAILURE_PATTERN_VALUE'
{{test_failure_pattern}}
GC_TEST_FAILURE_PATTERN_VALUE
)
ALLOWED_PATHS=$(cat <<'GC_ALLOWED_PATHS_VALUE'
{{allowed_paths}}
GC_ALLOWED_PATHS_VALUE
)
export TEST_COMMAND TEST_GATE TEST_FAILURE_PATTERN ALLOWED_PATHS
review_apply_fixes_load apply-fixes || exit $?  # sets REVIEW_ROOT/SYNTHESIS_VERDICT/FINDINGS/WORK_DIR/FIX_THRESHOLD + heartbeats

# cwd does NOT persist between steps — resume the branch under review.
[ -n "$REVIEW_WORK_DIR" ] && cd "$REVIEW_WORK_DIR"
REVIEW_SYNTHESIS_VERDICT=$(review_apply_fixes_synthesis_for_attempt \
  "$REVIEW_SYNTHESIS_VERDICT" "$REVIEW_TEST_RESULT" \
  "$REVIEW_TEST_FAILURE_ATTEMPT" "$REVIEW_ATTEMPT") || exit $?
echo "[apply-fixes] attempt=$REVIEW_ATTEMPT verdict=$REVIEW_SYNTHESIS_VERDICT test=$REVIEW_TEST_RESULT/$REVIEW_TEST_ATTEMPT promoted=$REVIEW_SYNTHESIS_PROMOTED burned(surfaced sub-threshold)=$REVIEW_SYNTHESIS_BURNED at $PWD"

if [ "$REVIEW_TEST_ATTEMPT" != "$REVIEW_ATTEMPT" ] || [ -z "$REVIEW_TEST_RESULT" ] || [ "$REVIEW_TEST_RESULT" = running ]; then
  review_apply_fixes_recover "missing or stale test-gate result for attempt $REVIEW_ATTEMPT" || exit $?
  exit 0
fi

# Missing synthesis is an execution/input failure for agents to repair.
if [ -z "$REVIEW_SYNTHESIS_VERDICT" ] || [ "$REVIEW_SYNTHESIS_VERDICT" = "blocked" ]; then
  review_apply_fixes_recover "synthesis verdict=${REVIEW_SYNTHESIS_VERDICT:-<none>} — cannot make progress" || exit $?
  exit 0
fi

# Neither regular convergence nor final verification may approve a later commit
# or a dirty worktree using the earlier test result.
APPLIED=no
if { [ "$REVIEW_SYNTHESIS_VERDICT" = pass ] && [ "$REVIEW_TEST_RESULT" = pass ]; } || [ "$REVIEW_ATTEMPT" -ge 4 ] 2>/dev/null; then
START_HEAD=$(review_apply_fixes__meta "$REVIEW_ROOT" 'gc.review.iteration_start_head')
CURRENT_HEAD=$(git -C "$REVIEW_WORK_DIR" rev-parse HEAD) || {
  review_apply_fixes_recover "cannot read branch HEAD before convergence" || exit $?
  exit 0
}
if [ -z "$START_HEAD" ]; then
  review_apply_fixes_recover "missing attempt $REVIEW_ATTEMPT start commit" || exit $?
  exit 0
fi
WORKTREE_STATE=$(git -C "$REVIEW_WORK_DIR" status --porcelain) || {
  review_apply_fixes_recover "cannot inspect worktree before convergence" || exit $?
  exit 0
}
if [ -n "$WORKTREE_STATE" ]; then
  review_apply_fixes_recover "uncommitted changes remain after the test gate; finish guarded fixes and re-review" || exit $?
  exit 0
fi
[ "$CURRENT_HEAD" = "$START_HEAD" ] || APPLIED=yes

fi

# Attempt four is the one finite verification allowed after fixes on attempt 3.
# It must not edit, commit, or start another iteration.
if [ "$REVIEW_ATTEMPT" -ge 4 ] 2>/dev/null; then
  action=$(review_apply_fixes_iteration_action "$REVIEW_SYNTHESIS_VERDICT" "$REVIEW_TEST_RESULT" "$APPLIED" "$REVIEW_ATTEMPT") || exit $?
  if [ "$action" = done ]; then
    review_apply_fixes_set_verdict done "final verification passed: synthesis=pass and test gate passed on attempt $REVIEW_ATTEMPT" || exit $?
  elif [ "$action" = recover ]; then
    review_apply_fixes_recover "final verification has incomplete review inputs" || exit $?
  else
    review_apply_fixes_replan "final verification attempt $REVIEW_ATTEMPT found synthesis=$REVIEW_SYNTHESIS_VERDICT test=$REVIEW_TEST_RESULT; fixes are not applied in verification" || exit $?
  fi
  exit 0
fi

# A failed test gate is a durable major/testing finding created by the test step.
# If synthesis itself was clean, surface it to apply-fixes as actionable work.
# This is the only clean convergence point in regular attempts.
if [ "$REVIEW_SYNTHESIS_VERDICT" = pass ] && [ "$REVIEW_TEST_RESULT" = pass ]; then
  action=$(review_apply_fixes_iteration_action "$REVIEW_SYNTHESIS_VERDICT" "$REVIEW_TEST_RESULT" "$APPLIED" "$REVIEW_ATTEMPT") || exit $?
  review_apply_fixes_set_verdict "$action" "synthesis and tests passed on attempt $REVIEW_ATTEMPT; applied=$APPLIED (surfaced sub-threshold: ${REVIEW_SYNTHESIS_BURNED:-0}); changed HEAD requires re-review" || exit $?
  exit 0
fi

# pass_with_findings / fail — there are durable findings to address. Enumerate
# them ranked must-fix first, including any testing finding from this attempt.
review_apply_fixes_findings            # TSV: id  severity  category  title (blocker -> nit)
```

Read each finding's full body for the file:line + evidence:

```bash
bd show <finding_id>                   # repeat per id from the TSV above
```

## 2. Apply the fixes (YOUR judgment — fix vs surface, per finding)

Resume the branch (you cd'd into REVIEW_WORK_DIR above) and, for each finding:
- severity at or above `FIX_THRESHOLD` (default minor: blocker/major/minor) — FIX it.
- below the threshold (e.g. a nit when the threshold is minor) — SURFACE it (note
  it in your commit body / summary) but do not fix it.

A `fail` verdict means at least one blocker survived; you MUST fix the blocker(s).
If a blocker is genuinely unfixable here (needs a different plan or assignment), preserve the finding and request agent
replanning. Do not fake a fix or widen the authorized scope:

```bash
# only if a blocker needs a different plan:
review_apply_fixes_replan "finding <id> needs replanning: <why>" || exit $?
exit 0
```

Otherwise apply the fixes and commit with a descriptive body. If you changed no
files, skip the commit helper and set APPLIED=no in section 3; actionable findings
still cannot converge, and the third regular attempt will request agent replanning if it makes no
new commit. This fix-mode
behavior — resume branch + apply findings + commit — is the mol-polecat-base
implement lifecycle running in fix mode. Before committing, run the guarded
commit helper below; do not run `git commit` or `git push` directly:

```bash
set -uo pipefail
. "${GC_CITY:?}/formulas/lib/review-apply-fixes.sh"
TEST_COMMAND=$(cat <<'GC_TEST_COMMAND_VALUE'
{{test_command}}
GC_TEST_COMMAND_VALUE
)
TEST_GATE=$(cat <<'GC_TEST_GATE_VALUE'
{{test_gate}}
GC_TEST_GATE_VALUE
)
TEST_FAILURE_PATTERN=$(cat <<'GC_TEST_FAILURE_PATTERN_VALUE'
{{test_failure_pattern}}
GC_TEST_FAILURE_PATTERN_VALUE
)
ALLOWED_PATHS=$(cat <<'GC_ALLOWED_PATHS_VALUE'
{{allowed_paths}}
GC_ALLOWED_PATHS_VALUE
)
export TEST_COMMAND TEST_GATE TEST_FAILURE_PATTERN ALLOWED_PATHS
review_apply_fixes_load apply-fixes || exit $?
commit_error_file=$(mktemp) || exit 2
PUSH_REMOTE=$(cat <<'GC_PUSH_REMOTE_VALUE'
{{push_remote}}
GC_PUSH_REMOTE_VALUE
)
review_apply_fixes_commit_and_push "fix: apply review findings on $REVIEW_ROOT" "$PUSH_REMOTE" 2>"$commit_error_file"
commit_status=$?
if [ "$commit_status" -eq 10 ]; then
  cat "$commit_error_file" >&2
  printf 'Commit diagnostic retained at %s\n' "$commit_error_file" >&2
  echo "test failure recorded; action=${REVIEW_ACTION:-iterate}; no commit was made"
  exit 0
fi
if [ "$commit_status" -ne 0 ]; then
  commit_error=$(tail -n 20 "$commit_error_file" | tr '\n' ' ' | cut -c 1-2000)
  cat "$commit_error_file" >&2
  printf 'Commit diagnostic retained at %s\n' "$commit_error_file" >&2
  [ -n "$commit_error" ] || commit_error="no diagnostic captured"
  if [ "$commit_status" -eq 3 ]; then
    review_apply_fixes_replan "scope refusal: $commit_error; preserve edits and reconcile the authorized assignment" || exit $?
  else
    review_apply_fixes_recover "commit/push failed (status $commit_status): $commit_error; preserve any existing commit and repair the failed action" || exit $?
  fi
  exit 0
fi
cat "$commit_error_file" >&2
printf 'Commit diagnostic retained at %s\n' "$commit_error_file" >&2

```

`allowed_paths` is an optional newline-separated list of repo-relative file
paths; directory prefixes end in `/`. When empty, the helper derives the list
from the reviewed diff and adds the matching formula or top-level `test/` and
`tests/` directories that exist. An out-of-scope refusal (status 3) requests agent replanning. An inspection
failure (status 2) requests agent recovery with the captured diagnostic; a test failure
(status 10) returns before commit and lets the current attempt decide whether to
iterate or replan. `test_command` defaults to the rig's
`formula_vars.test_command`; when empty, the commit test gate is skipped. The
temporary `test_gate` default is `no-new-failures`: when fix-head tests fail, the
same command runs once at the immutable review base in a disposable worktree.
The commit is allowed only when every fix-head failure identifier also appears
at the base. `strict` preserves the any-nonzero-fails behavior and is the
permanent target. Rigs may set `test_failure_pattern` to a Bash ERE with one
capture group for stable failure identifiers; the fallback compares normalized
FAIL/ERROR lines. A failed or impossible base comparison fails closed. Base
failures are stored in `gc.review.preexisting_test_failures` on the root and
reported in the apply-fixes note. A test-gate failure records a durable testing
finding and returns status 10 before commit or push; apply-fixes or the final
verification decides whether to iterate or replan. A push failure requests agent recovery after the local commit; preserve it and retry the failed push.

## 3. Require synthesis + tests, record whether this attempt committed, and write the verdict

Re-read durable state because this block may run in a fresh shell. Compare the
current head with the head recorded by this attempt's test step, record a new fix
commit when present, then require both synthesis and test gates to converge:

```bash
set -uo pipefail
. "${GC_CITY:?}/formulas/lib/review-apply-fixes.sh"
TEST_COMMAND=$(cat <<'GC_TEST_COMMAND_VALUE'
{{test_command}}
GC_TEST_COMMAND_VALUE
)
TEST_GATE=$(cat <<'GC_TEST_GATE_VALUE'
{{test_gate}}
GC_TEST_GATE_VALUE
)
TEST_FAILURE_PATTERN=$(cat <<'GC_TEST_FAILURE_PATTERN_VALUE'
{{test_failure_pattern}}
GC_TEST_FAILURE_PATTERN_VALUE
)
ALLOWED_PATHS=$(cat <<'GC_ALLOWED_PATHS_VALUE'
{{allowed_paths}}
GC_ALLOWED_PATHS_VALUE
)
export TEST_COMMAND TEST_GATE TEST_FAILURE_PATTERN ALLOWED_PATHS
review_apply_fixes_load apply-fixes || exit $?

REVIEW_SYNTHESIS_VERDICT=$(review_apply_fixes_synthesis_for_attempt \
  "$REVIEW_SYNTHESIS_VERDICT" "$REVIEW_TEST_RESULT" \
  "$REVIEW_TEST_FAILURE_ATTEMPT" "$REVIEW_ATTEMPT") || exit $?
if [ "$REVIEW_TEST_ATTEMPT" != "$REVIEW_ATTEMPT" ] || [ -z "$REVIEW_TEST_RESULT" ] || [ "$REVIEW_TEST_RESULT" = running ]; then
  review_apply_fixes_recover "missing or stale test-gate result for attempt $REVIEW_ATTEMPT" || exit $?
  exit 0
fi
START_HEAD=$(review_apply_fixes__meta "$REVIEW_ROOT" 'gc.review.iteration_start_head')
CURRENT_HEAD=$(git -C "$REVIEW_WORK_DIR" rev-parse HEAD) || {
  review_apply_fixes_recover "cannot read branch HEAD after the guarded commit" || exit $?
  exit 0
}
if [ -z "$START_HEAD" ]; then
  review_apply_fixes_recover "missing attempt $REVIEW_ATTEMPT start commit; cannot determine whether fixes were applied" || exit $?
  exit 0
fi
APPLIED=no
if [ "$CURRENT_HEAD" != "$START_HEAD" ]; then
  APPLIED=yes
  bd update "$REVIEW_ROOT" \
    --set-metadata gc.review.last_fix_attempt="$REVIEW_ATTEMPT" \
    --set-metadata gc.review.last_fix_head="$CURRENT_HEAD" || {
      review_apply_fixes_recover "could not record the fix commit for attempt $REVIEW_ATTEMPT" || exit $?
      exit 0
    }
fi

ACTION=$(review_apply_fixes_iteration_action \
  "$REVIEW_SYNTHESIS_VERDICT" "$REVIEW_TEST_RESULT" "$APPLIED" "$REVIEW_ATTEMPT") || exit $?
case "$ACTION" in
  done)
    review_apply_fixes_set_verdict done "synthesis=$REVIEW_SYNTHESIS_VERDICT tests=$REVIEW_TEST_RESULT applied=$APPLIED attempt=$REVIEW_ATTEMPT" || exit $?
    ;;
  iterate)
    review_apply_fixes_set_verdict iterate "synthesis=$REVIEW_SYNTHESIS_VERDICT tests=$REVIEW_TEST_RESULT applied=$APPLIED attempt=$REVIEW_ATTEMPT; re-review required" || exit $?
    ;;
  recover)
    review_apply_fixes_recover "attempt $REVIEW_ATTEMPT has incomplete review or test inputs" || exit $?
    ;;
  replan)
    review_apply_fixes_replan "attempt $REVIEW_ATTEMPT ended without clean synthesis/test pass and without a new fix commit" || exit $?
    ;;
  *) echo "ERROR: unknown loop action '$ACTION'" >&2; exit 2 ;;
esac
```

Exit criteria: done/iterate is recorded and the phase closes only after its
required work is complete. A recover/replan request leaves it owned and open;
exiting a shell block is NOT permission to finish the phase. Continue recovery
as the current agent or hand off through the configured notify_target agent.
Repair the actual tool/state/input error, then rerun the affected guarded step.
For replanning, preserve failed results and the current work, hand off with fresh
context, and retire the old workflow ROOT before replacing it through ordinary
native lifecycle. Do not create concurrent source writers or repeat an unchanged
failed strategy. A coordinator is an agent, not a new user approval gate.

Only when agents actually lack external authority/access or require a product
decision may review_apply_fixes_require_human <authority|access|decision> <reason>
be used. Supply the concrete missing capability/question after checking existing
authorization. Tool errors, findings, failed tests, and attempt exhaustion never
by themselves justify that route. Human requests also leave the phase open, so
no SDK change is required to prevent automatic retries. Never report recovery
or replanning as a passed test or review; never weaken scope or test gates.
'''

# --------------------------------------------------------------------------
# Compose the canonical reviewer into the review-pipeline slot — the SAME
# fragment the standalone host (mol-standard-review) expands, so the two share
# every prompt. The vars block maps the loop's vars into the fragment: the loop's
# `target` -> the fragment's `review_target` (the fragment reserves the bare name
# `target` for the expansion placeholder), severity_threshold + every model 1:1.
# Values use SINGLE braces because expansion override vars resolve against the
# loop's vars at compile time (substituteVars), not at render time.
# --------------------------------------------------------------------------

[compose]
[[compose.expand]]
target = "review-pipeline"
with = "expansion-standard-reviewer"
vars = { review_target = "{target}", base_branch = "{base_branch}", review_worker_target = "{review_worker_target}", aux_model = "{aux_model}", quality_model = "{quality_model}", security_model = "{security_model}", performance_model = "{performance_model}", architecture_model = "{architecture_model}", testing_model = "{testing_model}", docs_model = "{docs_model}", synthesis_model = "{synthesis_model}", severity_threshold = "{severity_threshold}" }
