[[rigs]]
name = "DeRham.jl"
prefix = "dr"
default_branch = "main"
[rigs.formula_vars]
review_worker_target = "gasvillage.polecat"
typecheck_command = "/Users/jj-agents/.juliaup/bin/julia --project=. -e 'using Pkg; Pkg.instantiate(); using DeRham'"
# Reviews run only the short (presubmit) E2E tier; the coordinator runs the
# medium (ci) tier at the end of an epic or phase (overseer decision 2026-10-27).
test_command = "/Users/jj-agents/.juliaup/bin/julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.test(test_args=[\"--workflow=presubmit\"])'"
lint_command = "PATH=/Users/jj-agents/.juliaup/bin:$PATH /Users/Shared/Developer/ai/city/math-city/packs/julia-tools/lib/no-code-comments.sh"
# Comment lint enforced only on new changes (overseer decision, bead dr-to77):
# template-fragments/derham-lint-policy.template.md
[[rigs.patches]]
agent = "polecat"
append_fragments = ["derham-lint-policy"]
[rigs.imports]
[rigs.imports.basic-code-tools]
source = "./packs/basic-code-tools"
[rigs.imports.gasvillage]
source = "./packs/gasvillage"

[[rigs]]
name = "rforest"
prefix = "rf"
default_branch = "main"
# Publication policy for all rforest work, including crew coordination:
# template-fragments/rforest-git-policy.template.md
# Append this fragment to any additional coding/review agent imported here.
[[rigs.patches]]
agent = "polecat"
append_fragments = ["rforest-git-policy"]
[rigs.imports]
[rigs.imports.gasvillage]
source = "./packs/gasvillage"

