prefix = "gfm"
default_branch = "main"
[rigs.formula_vars]
review_worker_target = "gasvillage.polecat"
typecheck_command = "/Users/jj-agents/.juliaup/bin/julia --project=. -e 'using Pkg; Pkg.instantiate(); using GPUFiniteFieldMatrices'"
test_command = "/Users/jj-agents/.juliaup/bin/julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.test()'"
lint_command = "PATH=/Users/jj-agents/.juliaup/bin:$PATH /Users/Shared/Developer/ai/city/math-city/packs/julia-tools/lib/no-code-comments.sh"
[rigs.imports]
[rigs.imports.basic-code-tools]
source = "./packs/basic-code-tools"
[rigs.imports.gasvillage]
