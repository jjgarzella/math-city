[workspace]
provider = "claude"

[providers]
[providers.claude]
base = "builtin:claude"
ready_delay_ms = 0
[providers.claude.option_defaults]
effort = "xhigh"
[providers.codex]
base = "builtin:codex"
ready_delay_ms = 0
[providers.codex.option_defaults]
effort = "high"

[[named_session]]
template = "anatoly"
scope = "rig"
dir = "Nemo.jl"
mode = "on_demand"

[[named_session]]
template = "kurt"
scope = "rig"
dir = "GPUFiniteFieldMatrices.jl"
mode = "on_demand"

[[named_session]]
template = "peter"
scope = "rig"
dir = "gascity"
mode = "on_demand"

[[named_session]]
template = "bryan"
scope = "rig"
dir = "GPUPolynomials.jl"
mode = "on_demand"

[[rigs]]
name = "math-experiments"
prefix = "mx"
default_branch = "main"
[rigs.imports]
[rigs.imports.gasvillage]
source = "packs/gasvillage"
[rigs.imports.labtech]
source = "packs/labtech"

[[rigs]]
name = "gascity"
prefix = "gcs"
default_branch = "main"
# Per-rig CI commands consumed by polecat preflight + self-review (mol-polecat-*).
# gascity is a Go SDK; empty keys (setup/typecheck) skip silently.
[rigs.formula_vars]
lint_command = "go vet ./..."
build_command = "go build ./..."
test_command = "make test"
[rigs.imports]
[rigs.imports.gasvillage]
source = "packs/gasvillage"

[[rigs]]
name = "GPUFiniteFieldMatrices.jl"
default_branch = "main"
[rigs.imports]
[rigs.imports.gasvillage]
source = "packs/gasvillage"

[[rigs]]
name = "DeRham.jl"
default_branch = "main"
[rigs.imports]
[rigs.imports.gasvillage]
source = "packs/gasvillage"

[[rigs]]
name = "phd-thesis"
default_branch = "main"
[rigs.imports]
[rigs.imports.gasvillage]
source = "packs/gasvillage"
[rigs.imports.latex-utils]
source = "packs/latex-utils"

[[rigs]]
name = "beads"
prefix = "beads"
default_branch = "main"
[rigs.imports]
[rigs.imports.gasvillage]
source = "packs/gasvillage"

[[rigs]]
name = "gascity-packs"
default_branch = "main"

[[rigs]]
name = "NewtonExperiments"
prefix = "ne"
default_branch = "main"
[rigs.imports]
[rigs.imports.gasvillage]
source = "./packs/gasvillage"

[[rigs]]
name = "Nemo.jl"
prefix = "nm"
default_branch = "master"
[rigs.imports]
[rigs.imports.gasvillage]
source = "./packs/gasvillage"

[[rigs]]
name = "MMPSingularities.jl"
prefix = "mmp"
default_branch = "main"
[rigs.imports]
[rigs.imports.gasvillage]
source = "./packs/gasvillage"

[[rigs]]
name = "GPUPolynomials.jl"
prefix = "gpp"
default_branch = "main"
[rigs.imports]
[rigs.imports.gasvillage]
source = "./packs/gasvillage"

[patches]

[[patches.agent]]
dir = "math-experiments"
name = "labtech.tick"
suspended = false
[patches.agent.option_defaults]
effort = "high"
model = "sonnet"

[daemon]
formula_v2 = true
