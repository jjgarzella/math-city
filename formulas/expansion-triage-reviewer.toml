## 1. Load the run + enumerate the candidates (run verbatim)

Pure transport — no judgment. Source the shared synthesis helper (referenced via
`$GC_CITY`, branch-independent, exactly like the lane helper) and load the run:

```bash
set -uo pipefail
. "${GC_CITY:?GC_CITY must be set by the runtime}/formulas/lib/review-synthesis.sh"
review_synthesis_load          # sets REVIEW_ROOT/FINDINGS/INPUTS_DIR/DIFF/SUMMARY/ELIGIBLE + heartbeats

if [ "$REVIEW_ELIGIBLE" = "no" ]; then
  review_synthesis_record_verdict pass 0 0 0 0 "ineligible change — nothing to synthesize"
  exit 0
fi

# Tab-separated candidates: <wisp_id>  <category>  <confidence 0-100>  <title>
review_synthesis_candidates | tee "$REVIEW_INPUTS_DIR/candidates.tsv"
```

If `candidates.tsv` is EMPTY, the five lenses found nothing — a clean pass. Record
it and stop:

```bash
review_synthesis_record_verdict pass 0 0 0 0 "no candidate findings from any lane"
exit 0
```

Otherwise read each candidate's full body for the file:line, evidence, and the
lane's self-rated `Confidence: X/100` first line:

```bash
bd show <wisp_id>              # repeat per candidate id from candidates.tsv
```

## 2. Re-score each candidate's confidence + apply the threshold gate (judgment — triage's precision gate)

For EACH candidate, re-score its confidence 0-100 — do NOT take the lane's
self-rating at face value — using this rubric, applied VERBATIM (the Anthropic
code-review command's rubric; do not paraphrase):

> 0: Not confident at all. This is a false positive that doesn't stand up to light scrutiny, or is a pre-existing issue.
> 25: Somewhat confident. This might be a real issue, but may also be a false positive. The agent wasn't able to verify that it's a real issue. If the issue is stylistic, it is one that was not explicitly called out in the relevant CLAUDE.md.
> 50: Moderately confident. The agent was able to verify this is a real issue, but it might be a nitpick or not happen very often in practice. Relative to the rest of the PR, it's not very important.
> 75: Highly confident. The agent double checked the issue, and verified that it is very likely it is a real issue that will be hit in practice. The existing approach in the PR is insufficient. The issue is very important and will directly impact the code's functionality, or it is an issue that is directly mentioned in the relevant CLAUDE.md.
> 100: Absolutely certain. The agent double checked the issue, and confirmed that it is definitely a real issue, that will happen frequently in practice. The evidence directly confirms this.

For a candidate flagged on a project-rule violation, FIRST verify the cited rule
file actually calls out that issue specifically before scoring it high; if the rule
does not actually say it, score it low. (Read "the relevant CLAUDE.md" as any
discovered rule file, and "PR" as the diff under review.)

Then apply triage's PRECISION GATE: every candidate re-scored BELOW the threshold
`{threshold}` is BURNED (it is a sub-threshold reject). Only candidates at or
above the threshold continue to dedup + promotion. This is what makes triage
high-precision: it flags only (a) written-rule violations and (b) real bugs it is
confident about.

## 3. Dedup-merge the survivors (judgment — conservative, like the legacy triage step 7)

Operate ONLY on the survivors (re-score at/above the threshold). Cluster survivors
that describe the SAME underlying issue: the same file, an overlapping line range,
AND the same root cause — all three must match. Be CONSERVATIVE — when in doubt,
keep them separate. Different lenses flagging genuinely different problems on
adjacent lines are NOT duplicates; a finding several lenses raised is STRONGER, not
redundant.

For each cluster of two or more, pick ONE canonical survivor (the one with the
highest re-score; break ties by richer evidence, then lexicographically smallest
wisp id). The canonical keeps the cluster's highest re-score. You may
`bd label add category:<lens> <survivor>` for each lens that raised it, so the
durable bead stays traceable to every lane. The other cluster members are
duplicates to burn in step 5.

## 4. Assign a final severity to each canonical survivor (judgment)

Score each canonical survivor on impact:

- **blocker** — must fix before this change merges: a correctness bug, security
  hole, data loss, or crash on the changed surface.
- **major** — should fix: a real defect or significant risk that is not a hard
  merge gate.
- **minor** — worth fixing: a smaller defect or a real maintainability problem.
- **nit** — trivial; optional. (Triage rarely files nits — its lenses already
  exclude nitpicks — but use it if a real-but-trivial issue cleared the gate.)

Triage does NOT suppress by severity: every confidence-survivor is promoted. The
severity ranks the durable finding (and drives the verdict below).

## 5. Promote survivors, burn the rest (run verbatim per candidate)

Materialize your step-2/3/4 decisions. Promotion turns the ephemeral wisp into a
durable finding bead (preserving its id, its category labels, and its place under
the findings container) and stamps the final severity; burning removes a
sub-threshold reject or a dedup duplicate. Keep running tallies for the verdict.

```bash
set -uo pipefail
. "${GC_CITY:?}/formulas/lib/review-synthesis.sh"
review_synthesis_load

# --- promote each canonical survivor at/above the threshold: ---
#   review_synthesis_promote <wisp_id> <blocker|major|minor|nit> "<one-line rationale>"
review_synthesis_promote <wisp_id> <severity> "confidence <re-score>/100: <why this severity>"

# --- burn each sub-threshold reject (re-score < threshold) or dedup duplicate: ---
#   review_synthesis_burn <wisp_id> "<below threshold {threshold} | duplicate of <survivor>>"
review_synthesis_burn <wisp_id> "<reason>"
```

## 6. Record the verdict (run verbatim, substituting your tallies + verdict)

The synthesis verdict summarizes the run for apply-fixes and the human gate:

- `fail` — at least one **blocker** survived (must-fix before merge).
- `pass_with_findings` — findings survived but **none** are blockers.
- `pass` — no candidate cleared the confidence threshold (clean).

`considered` = total candidates you re-scored; `promoted` = canonical survivors
made durable; `merged` = dedup duplicates folded into a survivor then burned;
`burned` = sub-threshold rejects burned. (promoted + merged + burned should equal
considered.)

```bash
set -uo pipefail
. "${GC_CITY:?}/formulas/lib/review-synthesis.sh"
review_synthesis_load
review_synthesis_record_verdict <pass|pass_with_findings|fail> \
  <considered> <promoted> <merged> <burned> \
  "<one-line headline: e.g. 2 real bugs (1 blocker) + 1 rule violation; 4 below threshold {threshold}>"
```

`review_synthesis_record_verdict` writes `gc.review.synthesis_verdict` + counts on
the molecule root, closes the findings container (its surviving children are the
durable findings), and closes this synthesis bead `gc.outcome=pass`.

Exit criteria: every candidate is promoted (durable, severity-tagged child of
`${REVIEW_ROOT}.findings`) or burned; the molecule root carries
`gc.review.synthesis_verdict` + counts; this synthesis bead is closed
`gc.outcome=pass`. Zero survivors is a clean `pass`. The durable findings + the
verdict are what apply-fixes and the human gate consume.
'''
