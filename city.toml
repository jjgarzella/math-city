[workspace]
provider = "claude"

[providers]
[providers.claude]
base = "builtin:claude"
ready_delay_ms = 0
[providers.claude.option_defaults]
effort = "xhigh"
[providers.codex]
base = "builtin:codex"
ready_delay_ms = 0

[[named_session]]
template = "anatoly"
scope = "rig"
dir = "phd-thesis"
mode = "on_demand"

[[named_session]]
template = "kurt"
scope = "rig"
dir = "gascity"
mode = "on_demand"

[[named_session]]
template = "peter"
scope = "rig"
dir = "gascity"
mode = "on_demand"

[[named_session]]
template = "bryan"
scope = "rig"
dir = "math-experiments"
mode = "on_demand"

[[rigs]]
name = "math-experiments"
prefix = "mx"
default_branch = "main"
[rigs.imports]
[rigs.imports.gasvillage]
source = "packs/gasvillage"
[rigs.imports.labtech]
source = "packs/labtech"

[[rigs]]
name = "gascity"
prefix = "gcs"
default_branch = "main"
[rigs.imports]
[rigs.imports.gasvillage]
source = "packs/gasvillage"

[[rigs]]
name = "GPUFiniteFieldMatrices.jl"
default_branch = "main"
[rigs.imports]
[rigs.imports.gasvillage]
source = "packs/gasvillage"

[[rigs]]
name = "DeRham.jl"
default_branch = "main"
[rigs.imports]
[rigs.imports.gasvillage]
source = "packs/gasvillage"

[[rigs]]
name = "phd-thesis"
default_branch = "main"
[rigs.imports]
[rigs.imports.gasvillage]
source = "packs/gasvillage"
[rigs.imports.latex-utils]
source = "packs/latex-utils"

[[rigs]]
name = "beads"
prefix = "beads"
default_branch = "main"
[rigs.imports]
[rigs.imports.gasvillage]
source = "packs/gasvillage"

[[rigs]]
name = "gascity-packs"
default_branch = "main"

[[rigs]]
name = "NewtonExperiments"
prefix = "ne"
default_branch = "main"
[rigs.imports]
[rigs.imports.gasvillage]
source = "./packs/gasvillage"

[daemon]
formula_v2 = true

